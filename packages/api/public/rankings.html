<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Term Checker — Rankings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: #1C1B18;
      background: #F6F5F2;
      padding: 48px 20px;
    }
    main {
      max-width: 840px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -.3px;
      margin-bottom: 4px;
    }
    .lede {
      color: #79776E;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    section {
      background: #FFFFFF;
      border: 1px solid #E2E0D9;
      border-radius: 10px;
      padding: 20px 22px;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
      color: #79776E;
    }
    .best h2 { color: #15803d; }
    .worst h2 { color: #b91c1c; }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #F3F0E8;
    }
    .row:last-child { border-bottom: none; }
    .rank {
      flex: 0 0 22px;
      color: #9CA39E;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      padding-top: 2px;
    }
    .badge {
      flex: 0 0 38px;
      height: 38px;
      border-radius: 50%;
      background: #6b7280;
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge.good { background: #22c55e; }
    .badge.fair { background: #f59e0b; }
    .badge.poor { background: #ef4444; }
    .meta { min-width: 0; flex: 1; }
    .domain {
      font-weight: 600;
      font-size: 14.5px;
      color: #1C1B18;
      word-break: break-all;
    }
    .summary {
      color: #57554F;
      font-size: 12.5px;
      line-height: 1.5;
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty { color: #9CA39E; font-size: 13px; padding: 8px 0; }
    .err { color: #b91c1c; font-size: 13px; }
    a.back { color: #57554F; font-size: 13px; text-decoration: none; }
    a.back:hover { color: #1C1B18; }
  </style>
</head>
<body>
  <main>
    <h1>Site Rankings</h1>
    <p class="lede">Privacy scores from our latest analysis of each site. Updated as new analyses land.</p>
    <div class="grid">
      <section class="best">
        <h2>Best 5</h2>
        <div id="best"><p class="empty">Loading…</p></div>
      </section>
      <section class="worst">
        <h2>Worst 5</h2>
        <div id="worst"><p class="empty">Loading…</p></div>
      </section>
    </div>
  </main>
  <script>
    function tierClass(score) {
      if (score >= 8) return 'good';
      if (score >= 5) return 'fair';
      return 'poor';
    }

    function render(target, list) {
      const el = document.getElementById(target);
      el.replaceChildren();
      if (!Array.isArray(list) || list.length === 0) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'No sites yet.';
        el.appendChild(p);
        return;
      }
      list.forEach(function (item, i) {
        const row = document.createElement('div');
        row.className = 'row';

        const rank = document.createElement('div');
        rank.className = 'rank';
        rank.textContent = '#' + (i + 1);
        row.appendChild(rank);

        const badge = document.createElement('div');
        badge.className = 'badge ' + tierClass(item.overallScore);
        badge.textContent = String(item.overallScore);
        row.appendChild(badge);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const dom = document.createElement('div');
        dom.className = 'domain';
        dom.textContent = item.domain;
        meta.appendChild(dom);
        const sum = document.createElement('div');
        sum.className = 'summary';
        sum.textContent = item.summary || '';
        meta.appendChild(sum);
        row.appendChild(meta);

        el.appendChild(row);
      });
    }

    fetch('/api/v1/rankings')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        render('best', data.best);
        render('worst', data.worst);
      })
      .catch(function (err) {
        const e = document.getElementById('best');
        e.replaceChildren();
        const p = document.createElement('p');
        p.className = 'err';
        p.textContent = 'Could not load rankings: ' + err.message;
        e.appendChild(p);
        document.getElementById('worst').replaceChildren();
      });
  </script>
</body>
</html>
