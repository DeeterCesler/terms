<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Term Checker — Rankings</title>
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon128.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon48.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon16.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: #1C1B18;
      background: #F6F5F2;
      padding: 48px 20px;
    }
    main {
      max-width: 840px;
      margin: 0 auto;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #1C1B18;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: block;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.2px;
    }
    .page-nav { display: flex; gap: 16px; }
    .nav-link {
      color: #57554F;
      font-size: 14px;
      text-decoration: none;
    }
    .nav-link:hover { color: #1C1B18; text-decoration: underline; }
    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -.3px;
      margin-bottom: 4px;
    }
    .lede {
      color: #79776E;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      background: #FFFFFF;
      border: 1px solid #E2E0D9;
      border-radius: 10px;
      padding: 16px 22px;
      margin-bottom: 28px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .stat + .stat { border-left: 1px solid #F3F0E8; padding-left: 18px; }
    .stat-value {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -.3px;
      color: #1C1B18;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.stat-text {
      font-size: 15px;
      font-weight: 500;
    }
    .stat-label {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #79776E;
    }
    @media (max-width: 540px) {
      .stats { grid-template-columns: minmax(0, 1fr); }
      .stat + .stat { border-left: none; padding-left: 0; border-top: 1px solid #F3F0E8; padding-top: 12px; }
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 20px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    section {
      background: #FFFFFF;
      border: 1px solid #E2E0D9;
      border-radius: 10px;
      padding: 20px 22px;
      min-width: 0;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
      color: #79776E;
    }
    .best h2 { color: #15803d; }
    .worst h2 { color: #b91c1c; }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #F3F0E8;
    }
    .row:last-child { border-bottom: none; }
    .rank {
      flex: 0 0 22px;
      color: #9CA39E;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      padding-top: 2px;
    }
    .badge {
      flex: 0 0 38px;
      height: 38px;
      border-radius: 50%;
      background: #6b7280;
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge.good { background: #22c55e; }
    .badge.fair { background: #f59e0b; }
    .badge.poor { background: #ef4444; }
    .meta { min-width: 0; flex: 1; }
    .domain {
      font-weight: 600;
      font-size: 14.5px;
      color: #1C1B18;
      word-break: break-all;
    }
    .summary {
      color: #57554F;
      font-size: 12.5px;
      line-height: 1.5;
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .shared-with {
      color: #79776E;
      font-size: 11.5px;
      margin-top: 4px;
      font-style: italic;
    }
    .empty { color: #9CA39E; font-size: 13px; padding: 8px 0; }
    .err { color: #b91c1c; font-size: 13px; }
    a.back { color: #57554F; font-size: 13px; text-decoration: none; }
    a.back:hover { color: #1C1B18; }
  </style>
</head>
<body>
  <main>
    <div class="page-header">
      <a class="brand" href="/">
        <img class="brand-mark" src="/icons/icon128.png" alt="">
        <span class="brand-name">Term Checker</span>
      </a>
      <nav class="page-nav">
        <a class="nav-link" href="/privacy">Privacy Policy</a>
      </nav>
    </div>
    <h1>Site Rankings</h1>
    <p class="lede">Privacy scores from our latest analysis of each site. Updated as new analyses land.</p>
    <div class="stats">
      <!--STATS_STRIP-->
    </div>
    <div class="grid">
      <section class="best">
        <h2>Best 5</h2>
        <!--BEST_ROWS-->
      </section>
      <section class="worst">
        <h2>Worst 5</h2>
        <!--WORST_ROWS-->
      </section>
    </div>
  </main>
</body>
</html>
