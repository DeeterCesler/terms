services:
  - type: web
    name: terms-api
    runtime: docker
    dockerfilePath: ./packages/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: terms-db
          property: connectionString
      - key: ADMIN_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "240"

databases:
  - name: terms-db
    plan: basic-256mb
    postgresMajorVersion: "16"
